# Docker build: same as pyproject.toml but without pyrfc in dependencies (pyrfc is installed from patched source in Dockerfile).
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-rfc-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for SAP RFC function calls with enhanced metadata management"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Tadeusz Hupalo", email = "tadeusz.hupalo@gmail.com"}
]
keywords = ["sap", "rfc", "mcp", "model-context-protocol", "metadata", "pyrfc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "click>=8.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
sap = []
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.2.0",
    "pytest-timeout>=2.1.0",
    "pytest-html>=3.1.0",
    "requests>=2.31.0",
    "responses>=0.23.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/thupalo/sap-rfc-mcp-server"
Documentation = "https://github.com/thupalo/sap-rfc-mcp-server/docs"
Repository = "https://github.com/thupalo/sap-rfc-mcp-server"
Issues = "https://github.com/thupalo/sap-rfc-mcp-server/issues"
Changelog = "https://github.com/thupalo/sap-rfc-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
sap-rfc-mcp-server = "sap_rfc_mcp_server.server:main"
sap-rfc-mcp-http-server = "sap_rfc_mcp_server.http_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sap_rfc_mcp_server*"]

[tool.setuptools.package-data]
sap_rfc_mcp_server = ["py.typed"]
